<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Compose · Solicitação interna</title>
  <style>html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#f5f7fc}#loading{position:absolute;inset:0;display:grid;place-items:center;font:14px system-ui;color:#667085}</style>
</head>
<body>
  <div id="loading">Carregando Compose…</div>
  <script src="compose-feature.js"></script>
  <script>window.addEventListener('message',e=>{if(e.origin===location.origin&&e.data?.type==='compose-ready')document.getElementById('loading')?.remove()});</script>
</body>
</html>
