<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>WebView probe</title>
<style>body{font:16px/1.4 sans-serif;margin:16px;color:#1f2937;background:#fff}h1{font-size:20px;margin:0 0 8px}a{color:#1d4ed8}button{font:inherit;margin:2px 4px 2px 0}</style></head>
<body>
<h1 id="heading">Página do laboratório</h1>
<p id="origin-note">Este documento é servido pelo próprio laboratório, dentro de um iframe com sandbox sem allow-same-origin.</p>
<p><a id="next" href="second.html">segunda página</a></p>
<p><button id="note" type="button">Probe.note</button><button id="alert" type="button">alert</button><button id="log" type="button">console.log</button></p>
<form id="search" method="get" action="second.html"><input name="q" value="lab"><button type="submit">enviar</button></form>
<script>
document.title = 'WebView probe (script ativo)';
document.getElementById('origin-note').dataset.script = 'ran';
console.log('probe page loaded');
document.getElementById('note').addEventListener('click', function () { if (window.Probe) window.Probe.note('clicked'); else console.warn('no Probe interface'); });
document.getElementById('alert').addEventListener('click', function () { alert('olá do WebView'); });
document.getElementById('log').addEventListener('click', function () { console.log('clicked log', { n: 1 }); });
</script>
</body>
</html>
