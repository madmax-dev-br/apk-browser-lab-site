<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>APK player frame</title>
  <link rel="stylesheet" href="../styles.css?v=d20881b83aa7">
  <link rel="stylesheet" href="./frame.css?v=d20881b83aa7">
</head>
<body class="player-frame">
  <main id="preview-stage" class="preview-stage player-stage">
    <div id="android-device" class="android-device" hidden>
            <div id="android-screen" class="android-screen">
              <div id="android-content" class="android-content"></div>
              <div id="android-window-layer" class="android-window-layer"></div>
              <div id="boot-overlay" class="boot-overlay" hidden role="status" aria-live="polite"><div class="boot-screen"><img id="boot-app-icon" class="boot-app-icon" alt="" hidden><svg class="boot-logo" viewBox="0 0 24 24" width="84" height="84" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M17.6 9.48l1.84-3.18c.16-.31.04-.69-.26-.85-.29-.15-.65-.06-.83.22l-1.88 3.24a11.463 11.463 0 00-8.94 0L5.65 5.67c-.19-.29-.58-.38-.87-.2-.28.18-.37.54-.22.83L6.4 9.48A10.78 10.78 0 001 18h22a10.78 10.78 0 00-5.4-8.52zM7 15.25a1.25 1.25 0 110-2.5 1.25 1.25 0 010 2.5zm10 0a1.25 1.25 0 110-2.5 1.25 1.25 0 010 2.5z"/></svg><div class="boot-bar"><i></i></div><p id="boot-caption" class="boot-caption">Starting…</p></div></div>
              <canvas id="layout-bounds-canvas" class="layout-bounds-canvas" aria-hidden="true" hidden></canvas>
              <canvas id="frame-graph-canvas" class="frame-graph-canvas" aria-hidden="true" hidden></canvas>
              <div id="lab-highlight-layer" class="lab-highlight-layer" aria-hidden="true"></div>
              <div id="debug-paused-overlay" class="debug-paused-overlay" role="status" aria-live="polite" hidden><div class="dpo-plate"><p class="dpo-title">Paused in the debugger</p><p class="dpo-where"></p><p class="dpo-note">The app's threads are suspended: taps and keys wait until it resumes.</p><button class="dpo-resume" type="button">Resume <kbd>F8</kbd></button></div></div>
              <div id="permission-dialog" class="perm-scrim" hidden><div class="perm-card" role="alertdialog" aria-modal="true" aria-labelledby="perm-question" aria-describedby="perm-detail" tabindex="-1"><div class="perm-icon" id="perm-icon" aria-hidden="true"></div><p id="perm-question" class="perm-question"></p><p id="perm-detail" class="perm-detail"></p><div class="perm-actions"><button id="perm-allow" type="button" class="perm-button"></button><button id="perm-once" type="button" class="perm-button" hidden>Only this time</button><button id="perm-deny" type="button" class="perm-button">Don't allow</button></div></div></div>
              <div id="system-picker" class="sp-scrim" hidden></div>
              <div class="system-bars" aria-hidden="true">
                <div id="sysbar-status" class="sysbar-status"><span id="sysbar-clock" class="sysbar-clock">9:41</span><span class="sysbar-cutout"></span><span class="sysbar-icons"><svg id="sysbar-wifi" viewBox="0 0 24 24" width="14" height="14"><path d="M12 18.5a1.6 1.6 0 1 0 0 3.2 1.6 1.6 0 0 0 0-3.2zM2.4 9.2l1.9 1.9a10.8 10.8 0 0 1 15.4 0l1.9-1.9a13.5 13.5 0 0 0-19.2 0zM6.2 13l1.9 1.9a5.4 5.4 0 0 1 7.8 0l1.9-1.9a8.1 8.1 0 0 0-11.6 0z" fill="currentColor"/></svg><svg id="sysbar-cell" viewBox="0 0 24 24" width="14" height="14"><path d="M2 22h20V2z" fill="currentColor"/></svg><span class="sysbar-battery"><span id="sysbar-battery-level" class="sysbar-battery-level"></span><b id="sysbar-bolt" hidden>⚡</b></span></span></div>
                <div id="sysbar-nav" class="sysbar-nav"><span class="sysbar-handle"></span><span class="sysbar-buttons"><i class="sysbar-back"></i><i class="sysbar-home"></i><i class="sysbar-recents"></i></span></div>
              </div>
            </div>
          </div>
    <div id="player-status" class="player-status" role="status" aria-live="polite">Waiting for the host page…</div>
    <div id="player-error" class="player-error" role="alert" hidden><strong id="player-error-title"></strong><p id="player-error-message"></p><button id="player-error-copy" class="player-error-copy" type="button">Copy diagnostics</button><pre id="player-error-report" class="player-error-report" hidden></pre></div>
  </main>
  <script type="module" src="./frame.js?v=d20881b83aa7"></script>
</body>
</html>
